#DB Url and DB name (pmsdb-prod)
spring.datasource.url=jdbc:mysql://localhost:3306/pmsdb-prod?useSSL=false&serverTimezone=UTC&useLegacyDateTimeCode=false
#DB username
spring.datasource.username=root
#DBPassword
spring.database.password=
#DB Driver
spring.datasource.driverClassName=com.mysql.jdbc.Driver
# Tells DB to keep existing data and table while server restart, other value is "Create" where after server
# restarts all the tables will be dropped and new tables will be created.
spring.jpa.hibernate.ddl-auto = update
#This enables printing of sql queries generated by hibernate in console
#This needs to be false when deployed to production, we don't want to see queries in Production
spring.jpa.show-sql=true
##Hibernate properties
#SQL dialect makes hibernate generate better SQL for the chosen DB
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect
spring.jackson.serialization.fail-on-empty-beans=false